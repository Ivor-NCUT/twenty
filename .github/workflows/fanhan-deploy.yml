name: Fanhan production

# No push trigger. Merging to deploy/fanhan must not start this file.
# pull_request runs tests only and cannot read the production environment.
on:
  pull_request:
    branches: [deploy/fanhan]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/deploy/fanhan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - name: Build shared package
        run: node ops/recruiting/build-source.mjs twenty-shared build
      - name: Build workspace package exports
        run: yarn nx run-many -t build -p twenty-ui twenty-emails twenty-client-sdk twenty-sdk twenty-front-component-renderer
      - name: Deploy contract regression
        run: node --test ops/recruiting/deploy/patch-compose.test.mjs
      - name: CLI regression
        run: node --test ops/recruiting/cli-auth.test.mjs ops/recruiting/cli.test.mjs ops/recruiting/cli-job-upload.test.mjs
      - name: Server regression
        working-directory: packages/twenty-server
        run: ../../node_modules/.bin/jest --runInBand --testPathPattern='src/modules/recruiting/|chatgpt-subscription/|is-provider-configured.util.spec'
      - name: Frontend regression
        working-directory: packages/twenty-front
        run: ../../node_modules/.bin/jest --runInBand --testPathPattern='recruiting|SettingsBriefTemplates|apiProxyPrefixes'
      - name: Server types
        working-directory: packages/twenty-server
        run: ../../node_modules/.bin/tsgo -p tsconfig.json --noEmit --incremental false
      - name: Frontend types
        working-directory: packages/twenty-front
        run: ../../node_modules/.bin/tsgo -p tsconfig.json --noEmit --incremental false

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deploy/fanhan' && github.repository == 'Ivor-NCUT/twenty' && vars.FANHAN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: fanhan-production
    permissions:
      contents: read
      packages: write
    timeout-minutes: 120
    concurrency:
      group: fanhan-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Refuse while the mailreply layer is absent
        run: node ops/recruiting/deploy/assert-mailreply-preserved.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define application version
        id: version
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          test "$owner" = "ivor-ncut"
          base_version="$(cat ops/recruiting/deploy/APP_VERSION)"
          [[ "$base_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "app_version=$base_version+$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/fanhan-twenty" >> "$GITHUB_OUTPUT"
      - name: Publish verified application image
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ github.sha }}
          build-args: APP_VERSION=${{ steps.version.outputs.app_version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fanhan-twenty
          cache-to: type=gha,scope=fanhan-twenty,mode=max
      - name: Deploy only the app image
        env:
          DEPLOY_TUNNEL_KEY: ${{ secrets.FANHAN_DOKPLOY_TUNNEL_KEY }}
          KNOWN_HOSTS: ${{ secrets.FANHAN_DOKPLOY_KNOWN_HOSTS }}
          DOKPLOY_API_KEY: ${{ secrets.FANHAN_DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.FANHAN_DOKPLOY_COMPOSE_ID }}
          APP_IMAGE: ${{ steps.version.outputs.image }}@${{ steps.app.outputs.digest }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          REGISTRY_HOST: ${{ vars.FANHAN_REGISTRY_HOST }}
        run: node ops/recruiting/deploy/deploy-compose.mjs
